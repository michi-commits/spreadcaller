    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Supabase config
        const SUPABASE_URL = 'https://zkfrxmsyaobhdwesipsg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InprZnJ4bXN5YW9iaGR3ZXNpcHNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyMzQ3NzEsImV4cCI6MjA4NjgxMDc3MX0.c2RpiSmUxNWCErMyCejoyCqQj737HgE3hKWAZmKY1wI';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Toast notification component
        function Toast({ message, type = 'info', onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-red-500' : type === 'success' ? 'bg-emerald-500' : 'bg-blue-500';

            return (
                <div className={`toast fixed bottom-4 right-4 ${bgColor} text-white px-6 py-3 rounded shadow-lg`}>
                    {message}
                </div>
            );
        }

        // CSV Parser
        function parseCSV(text) {
            const lines = text.replace(/^\ufeff/, '').split('\n');
            const headers = [];
            const rows = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const fields = [];
                let current = '';
                let inQuotes = false;

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    const nextChar = line[j + 1];

                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            current += '"';
                            j++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        fields.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                fields.push(current);

                if (i === 0) {
                    headers.push(...fields);
                } else {
                    const obj = {};
                    headers.forEach((h, idx) => {
                        obj[h.trim()] = fields[idx] ? fields[idx].trim() : '';
                    });
                    rows.push(obj);
                }
            }

            return { headers, rows };
        }

        // Google Calendar URL generator
        function generateGoogleCalendarUrl(title, description, date, time = '10:00') {
            try {
                const start = new Date(date + 'T' + time + ':00');
                const end = new Date(start.getTime() + 60 * 60 * 1000);
                const fmt = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
                return `https://calendar.google.com/calendar/r/eventedit?text=${encodeURIComponent(title)}&details=${encodeURIComponent(description)}&dates=${fmt(start)}/${fmt(end)}`;
            } catch (e) {
                return '';
            }
        }

        // Status badge component
        function StatusBadge({ status }) {
            const statusLabels = {
                'new': 'Neu',
                'enriching': 'Angereichert',
                'ready': 'Bereit',
                'in_progress': 'In Bearbeitung',
                'completed': 'Abgeschlossen',
                'archived': 'Archiviert'
            };

            const statusClass = `status-${status}`;
            return <span className={`status-badge ${statusClass}`}>{statusLabels[status] || status}</span>;
        }

        // CSV Import Modal
        function CSVImportModal({ isOpen, onClose, onImport, contacts }) {
            const [file, setFile] = useState(null);
            const [csvData, setCSVData] = useState(null);
            const [fieldMapping, setFieldMapping] = useState({});
            const [previewRows, setPreviewRows] = useState([]);
            const [duplicateInfo, setDuplicateInfo] = useState(null);
            const [checked, setChecked] = useState(false);

            const handleFileChange = (e) => {
                const f = e.target.files[0];
                if (f) {
                    setFile(f);
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const { headers, rows } = parseCSV(evt.target.result);
                        setCSVData({ headers, rows });
                        setPreviewRows(rows.slice(0, 5));

                        // Auto-detect field mapping
                        const mapping = {};
                        const lsn = ['First Name', 'first name', 'firstname', 'vorname'];
                        const lsln = ['Last Name', 'last name', 'lastname', 'nachname'];
                        const lsco = ['Company', 'company', 'unternehmen'];
                        const lstit = ['Title', 'title', 'titel', 'job title'];
                        const lswe = ['Company Website', 'company website', 'website', 'webseite'];
                        const lsli = ['LinkedIn URL', 'linkedin url', 'linkedin', 'linkedin profile url'];
                        const lsin = ['Industry', 'industry', 'industrie'];
                        const lscs = ['Company Size', 'company size', 'firmengröße', 'size'];
                        const lslo = ['Location', 'location', 'ort'];

                        headers.forEach(h => {
                            const hl = h.toLowerCase();
                            if (lsn.some(x => hl.includes(x.toLowerCase()))) mapping['first_name'] = h;
                            if (lsln.some(x => hl.includes(x.toLowerCase()))) mapping['last_name'] = h;
                            if (lsco.some(x => hl.includes(x.toLowerCase()))) mapping['company_name'] = h;
                            if (lstit.some(x => hl.includes(x.toLowerCase()))) mapping['job_title'] = h;
                            if (lswe.some(x => hl.includes(x.toLowerCase()))) mapping['website'] = h;
                            if (lsli.some(x => hl.includes(x.toLowerCase()))) mapping['linkedin_url'] = h;
                            if (lsin.some(x => hl.includes(x.toLowerCase()))) mapping['industry'] = h;
                            if (lscs.some(x => hl.includes(x.toLowerCase()))) mapping['company_size'] = h;
                            if (lslo.some(x => hl.includes(x.toLowerCase()))) mapping['location'] = h;
                        });

                        setFieldMapping(mapping);
                        setChecked(false);
                        setDuplicateInfo(null);
                    };
                    reader.readAsText(f);
                }
            };

            const handleMappingChange = (dbField, csvField) => {
                setFieldMapping(prev => ({ ...prev, [dbField]: csvField }));
                setDuplicateInfo(null);
                setChecked(false);
            };

            const checkDuplicates = async () => {
                if (!csvData) return;

                try {
                    const firstName = fieldMapping['first_name'];
                    const lastName = fieldMapping['last_name'];
                    const linkedinField = fieldMapping['linkedin_url'];
                    const emailField = fieldMapping['email'];
                    const companyField = fieldMapping['company_name'];

                    const duplicates = [];
                    const duplicateSet = new Set();

                    for (let i = 0; i < csvData.rows.length; i++) {
                        const row = csvData.rows[i];

                        let isDuplicate = false;
                        let duplicateReason = '';

                        // Check within import
                        if (i > 0) {
                            for (let j = 0; j < i; j++) {
                                const prevRow = csvData.rows[j];

                                if (linkedinField && row[linkedinField] && prevRow[linkedinField] === row[linkedinField]) {
                                    isDuplicate = true;
                                    duplicateReason = 'LinkedIn';
                                    break;
                                }

                                if (emailField && row[emailField] && prevRow[emailField] === row[emailField]) {
                                    isDuplicate = true;
                                    duplicateReason = 'Email';
                                    break;
                                }

                                if (companyField && firstName && lastName &&
                                    row[companyField] && row[firstName] && row[lastName] &&
                                    prevRow[companyField] === row[companyField] &&
                                    prevRow[firstName] === row[firstName] &&
                                    prevRow[lastName] === row[lastName]) {
                                    isDuplicate = true;
                                    duplicateReason = 'Unternehmen + Name';
                                    break;
                                }
                            }
                        }

                        // Check against database
                        if (!isDuplicate) {
                            const name = firstName && lastName ?
                                (row[firstName] + ' ' + row[lastName]).trim() :
                                firstName ? row[firstName] : '';

                            let query = supabase.from('contacts').select('id, contact_name, email, linkedin_url');

                            if (linkedinField && row[linkedinField]) {
                                const { data, error } = await query.eq('linkedin_url', row[linkedinField]);
                                if (data && data.length > 0) {
                                    isDuplicate = true;
                                    duplicateReason = 'LinkedIn in DB';
                                }
                            }

                            if (!isDuplicate && emailField && row[emailField]) {
                                const { data, error } = await supabase.from('contacts').select('id').eq('email', row[emailField]);
                                if (data && data.length > 0) {
                                    isDuplicate = true;
                                    duplicateReason = 'Email in DB';
                                }
                            }

                            if (!isDuplicate && companyField && name) {
                                const { data, error } = await supabase.from('contacts').select('id')
                                    .eq('company_name', row[companyField])
                                    .eq('contact_name', name);
                                if (data && data.length > 0) {
                                    isDuplicate = true;
                                    duplicateReason = 'Unternehmen + Name in DB';
                                }
                            }
                        }

                        if (isDuplicate) {
                            const company = row[fieldMapping['company_name']] || 'Unbekannt';
                            const name = firstName && lastName ?
                                (row[firstName] + ' ' + row[lastName]).trim() :
                                firstName ? row[firstName] : 'Unbekannt';
                            duplicates.push({ company, name, reason: duplicateReason });
                            duplicateSet.add(i);
                        }
                    }

                    setDuplicateInfo({
                        totalRows: csvData.rows.length,
                        duplicateCount: duplicates.length,
                        newCount: csvData.rows.length - duplicates.length,
                        duplicates: duplicates,
                        duplicateIndices: duplicateSet
                    });
                    setChecked(true);
                } catch (error) {
                    console.error('Duplicate check error:', error);
                    setDuplicateInfo({ error: 'Fehler beim Prüfen von Duplikaten' });
                }
            };

            const handleImport = async () => {
                if (!csvData || !fieldMapping) return;

                try {
                    const firstName = fieldMapping['first_name'];
                    const lastName = fieldMapping['last_name'];
                    const newContacts = [];

                    for (let i = 0; i < csvData.rows.length; i++) {
                        if (duplicateInfo && duplicateInfo.duplicateIndices && duplicateInfo.duplicateIndices.has(i)) {
                            continue;
                        }

                        const row = csvData.rows[i];
                        let contactName = '';

                        if (firstName && lastName) {
                            contactName = (row[firstName] + ' ' + row[lastName]).trim();
                        } else if (firstName) {
                            contactName = row[firstName];
                        } else if (lastName) {
                            contactName = row[lastName];
                        }

                        const contact = {
                            company_name: row[fieldMapping['company_name']] || '',
                            job_title: row[fieldMapping['job_title']] || '',
                            contact_name: contactName,
                            website: row[fieldMapping['website']] || '',
                            email: row[fieldMapping['email']] || '',
                            linkedin_url: row[fieldMapping['linkedin_url']] || '',
                            industry: row[fieldMapping['industry']] || '',
                            company_size: row[fieldMapping['company_size']] || '',
                            location: row[fieldMapping['location']] || '',
                            status: 'new',
                            created_at: new Date().toISOString()
                        };

                        newContacts.push(contact);
                    }

                    if (newContacts.length > 0) {
                        const { data, error } = await supabase.from('contacts').insert(newContacts).select();
                        if (error) throw error;

                        onImport(newContacts.length);
                        setFile(null);
                        setCSVData(null);
                        setFieldMapping({});
                        setPreviewRows([]);
                        setDuplicateInfo(null);
                        onClose();
                    } else {
                        alert('Keine neuen Kontakte zum Importieren.');
                    }
                } catch (error) {
                    console.error('Import error:', error);
                    alert('Fehler beim Importieren: ' + error.message);
                }
            };

            if (!isOpen) return null;

            return (
                <div className="modal-backdrop fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                    <div className="bg-slate-800 rounded-lg p-6 max-w-2xl w-full max-h-96 overflow-y-auto">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-white">CSV importieren</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
                        </div>

                        {!csvData ? (
                            <div className="border-2 border-dashed border-slate-600 rounded-lg p-8 text-center">
                                <label className="cursor-pointer">
                                    <input
                                        type="file"
                                        accept=".csv"
                                        onChange={handleFileChange}
                                        className="hidden"
                                    />
                                    <div className="text-slate-400 hover:text-white transition">
                                        <div className="text-4xl mb-2">📁</div>
                                        <div>CSV-Datei hier ablegen oder klicken</div>
                                    </div>
                                </label>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div>
                                    <h3 className="text-white font-semibold mb-2">Feldmapping</h3>
                                    <div className="space-y-2 mb-4">
                                        {[
                                            { db: 'first_name', label: 'Vorname' },
                                            { db: 'last_name', label: 'Nachname' },
                                            { db: 'company_name', label: 'Unternehmen' },
                                            { db: 'job_title', label: 'Titel' },
                                            { db: 'website', label: 'Website' },
                                            { db: 'linkedin_url', label: 'LinkedIn URL' },
                                            { db: 'industry', label: 'Branche' },
                                            { db: 'company_size', label: 'Firmengröße' },
                                            { db: 'location', label: 'Ort' }
                                        ].map(field => (
                                            <div key={field.db} className="flex items-center gap-2">
                                                <label className="w-32 text-slate-300 text-sm">{field.label}</label>
                                                <select
                                                    value={fieldMapping[field.db] || ''}
                                                    onChange={(e) => handleMappingChange(field.db, e.target.value)}
                                                    className="flex-1 bg-slate-700 text-white border border-slate-600 rounded px-2 py-1 text-sm"
                                                >
                                                    <option value="">-- Nicht zugeordnet --</option>
                                                    {csvData.headers.map(h => (
                                                        <option key={h} value={h}>{h}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {previewRows.length > 0 && (
                                    <div>
                                        <h3 className="text-white font-semibold mb-2">Vorschau (erste 5 Zeilen)</h3>
                                        <div className="bg-slate-700 rounded overflow-x-auto">
                                            <table className="w-full text-sm">
                                                <thead>
                                                    <tr className="border-b border-slate-600">
                                                        {csvData.headers.slice(0, 4).map(h => (
                                                            <th key={h} className="px-3 py-2 text-left text-slate-300 font-semibold">{h}</th>
                                                        ))}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {previewRows.map((row, idx) => (
                                                        <tr key={idx} className="border-b border-slate-600">
                                                            {csvData.headers.slice(0, 4).map(h => (
                                                                <td key={h} className="px-3 py-2 text-slate-300 truncate">{row[h]}</td>
                                                            ))}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {!checked && (
                                    <button
                                        onClick={checkDuplicates}
                                        className="w-full bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition"
                                    >
                                        Duplikate prüfen
                                    </button>
                                )}

                                {duplicateInfo && (
                                    <div className="bg-slate-700 rounded p-3">
                                        {duplicateInfo.error ? (
                                            <p className="text-red-400">{duplicateInfo.error}</p>
                                        ) : (
                                            <>
                                                <p className="text-slate-300 mb-2">
                                                    <strong>{duplicateInfo.duplicateCount}</strong> Duplikate gefunden,
                                                    <strong className="text-emerald-400"> {duplicateInfo.newCount}</strong> neue Kontakte
                                                </p>
                                                {duplicateInfo.duplicates.length > 0 && (
                                                    <div className="text-sm text-slate-400 max-h-32 overflow-y-auto">
                                                        {duplicateInfo.duplicates.map((dup, idx) => (
                                                            <div key={idx}>{dup.company} - {dup.name} ({dup.reason})</div>
                                                        ))}
                                                    </div>
                                                )}
                                            </>
                                        )}
                                    </div>
                                )}

                                <div className="flex gap-2">
                                    <button
                                        onClick={() => {
                                            setFile(null);
                                            setCSVData(null);
                                            setFieldMapping({});
                                            setPreviewRows([]);
                                            setDuplicateInfo(null);
                                            setChecked(false);
                                        }}
                                        className="flex-1 bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded transition"
                                    >
                                        Zurück
                                    </button>
                                    <button
                                        onClick={handleImport}
                                        disabled={!checked}
                                        className="flex-1 bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-600 text-white px-4 py-2 rounded transition"
                                    >
                                        {duplicateInfo ? `${duplicateInfo.newCount} Kontakte importieren` : 'Importieren'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Call Outcome Modal
        function CallOutcomeModal({ isOpen, onClose, contact, onSave }) {
            const [outcome, setOutcome] = useState('');
            const [notes, setNotes] = useState('');
            const [followUpDate, setFollowUpDate] = useState('');
            const [followUpTime, setFollowUpTime] = useState('10:00');
            const [taskType, setTaskType] = useState('');
            const [taskDesc, setTaskDesc] = useState('');
            const [taskDue, setTaskDue] = useState('');

            const handleSave = async () => {
                if (!outcome) return;

                try {
                    const callData = {
                        contact_id: contact.id,
                        call_date: new Date().toISOString(),
                        outcome: outcome,
                        notes: notes,
                        created_at: new Date().toISOString()
                    };

                    if (outcome === 'not_reached') {
                        const nextDate = new Date();
                        nextDate.setDate(nextDate.getDate() + 2);
                        callData.follow_up_date = nextDate.toISOString().split('T')[0];
                    } else if (outcome === 'callback' && followUpDate) {
                        callData.follow_up_date = followUpDate;
                    } else if (outcome === 'interested' && followUpDate) {
                        callData.follow_up_date = followUpDate;
                    }

                    const { data: callInserted, error: callError } = await supabase
                        .from('calls')
                        .insert([callData])
                        .select();

                    if (callError) throw callError;

                    let newStatus = contact.status;
                    if (outcome === 'interested') {
                        newStatus = 'in_progress';
                    } else if (outcome === 'not_interested') {
                        newStatus = 'archived';
                    } else if (outcome === 'info_requested') {
                        newStatus = 'in_progress';
                    } else if (outcome === 'not_reached') {
                        newStatus = 'in_progress';
                    } else if (outcome === 'wrong_number') {
                        newStatus = 'archived';
                    } else if (outcome === 'callback') {
                        newStatus = 'in_progress';
                    }

                    const { error: updateError } = await supabase
                        .from('contacts')
                        .update({ status: newStatus, updated_at: new Date().toISOString() })
                        .eq('id', contact.id);

                    if (updateError) throw updateError;

                    if (outcome === 'info_requested' && taskType && taskDue) {
                        const taskTypeMap = {
                            'showreel': 'send_showreel',
                            'offer': 'send_offer',
                            'case_study': 'send_case_study',
                            'presentation': 'prepare_presentation'
                        };

                        const { error: taskError } = await supabase
                            .from('tasks')
                            .insert([{
                                contact_id: contact.id,
                                task_type: taskTypeMap[taskType] || 'other',
                                description: taskDesc,
                                due_date: taskDue,
                                status: 'open',
                                created_at: new Date().toISOString()
                            }]);

                        if (taskError) throw taskError;
                    }

                    onSave();
                } catch (error) {
                    console.error('Error saving call:', error);
                    alert('Fehler beim Speichern: ' + error.message);
                }
            };

            if (!isOpen || !contact) return null;

            return (
                <div className="modal-backdrop fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                    <div className="bg-slate-800 rounded-lg p-6 max-w-md w-full">
                        <h2 className="text-xl font-bold text-white mb-4">Anrufergebnis erfassen</h2>

                        <div className="space-y-3 mb-4">
                            {[
                                { id: 'interested', label: 'Interessiert', classes: 'border-emerald-500 bg-emerald-500/20' },
                                { id: 'not_interested', label: 'Kein Interesse', classes: 'border-red-500 bg-red-500/20' },
                                { id: 'info_requested', label: 'Info gewünscht', classes: 'border-blue-500 bg-blue-500/20' },
                                { id: 'not_reached', label: 'Nicht erreicht', classes: 'border-amber-500 bg-amber-500/20' },
                                { id: 'wrong_number', label: 'Falsche Nummer', classes: 'border-slate-600 bg-slate-700' },
                                { id: 'callback', label: 'Rückruf vereinbart', classes: 'border-purple-500 bg-purple-500/20' }
                            ].map(btn => (
                                <button
                                    key={btn.id}

                            .from('tasks')
                            .select('*')
                            .eq('contact_id', contactId)

                        setTasks(tasksData || []);

                        {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,

                            },
                            body: JSON.stringify({

                    if (!response.ok) throw new Error('Enrichment failed');
                    const data = await response.json();

                        email: data.emails && data.emails.length > 0 ? data.emails[0] : contact.email,

        // Dashboard
        function Dashboard({ contacts, calls }) {
            const [stats, setStats] = useState({ callsToday: 0, successRate: 0, contactsReady: 0, totalContacts: 0 });
            const [chartData, setChartData] = useState([]);
            const [upcomingTasks, setUpcomingTasks] = useState([]);

            useEffect(() => {
                const today = new Date().toISOString().split('T')[0];
                const callsToday = calls.filter(c => c.call_date.startsWith(today)).length;
                const successful = calls.filter(c => c.outcome === 'interested').length;
                const successRate = calls.length > 0 ? Math.round((successful / calls.length) * 100) : 0;
                const contactsReady = contacts.filter(c => c.status === 'ready').length;

                setStats({
                    callsToday,
                    successRate,
                    contactsReady,
                    totalContacts: contacts.length
                });

                // Build chart data for last 7 days
                const data = [];
                for (let i = 6; i >= 0; i--) {
                    const date = new Date();
                    date.setDate(date.getDate() - i);
                    const dateStr = date.toISOString().split('T')[0];
                    const dayLabel = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][date.getDay()];
                    const count = calls.filter(c => c.call_date.startsWith(dateStr)).length;
                    data.push({ date: dateStr, label: dayLabel, count });
                }
                setChartData(data);

                const loadUpcoming = async () => {
                    try {
                        const today = new Date().toISOString().split('T')[0];
                        const nextWeek = new Date();
                        nextWeek.setDate(nextWeek.getDate() + 7);
                        const nextWeekStr = nextWeek.toISOString().split('T')[0];

                        const { data: tasksData } = await supabase
                            .from('tasks')
                            .select('*, contacts(contact_name, company_name)')
                            .gte('due_date', today)
                            .lte('due_date', nextWeekStr)
                            .order('due_date', { ascending: true })
                            .limit(5);

                        setUpcomingTasks(tasksData || []);
                    } catch (error) {
                        console.error('Error loading upcoming tasks:', error);
                    }
                };

                loadUpcoming();
            }, [contacts, calls]);

            const maxCount = Math.max(...chartData.map(d => d.count), 1);

            return (
                <div className="space-y-6">
                    <h1 className="text-3xl font-bold text-white">Dashboard</h1>

                    <div className="grid grid-cols-4 gap-4">
                        <div className="bg-slate-800 rounded-lg border border-slate-700 p-4">
                            <p className="text-slate-400 text-sm">Anrufe heute</p>
                            <p className="text-3xl font-bold text-emerald-400">{stats.callsToday}</p>
                        </div>
                        <div className="bg-slate-800 rounded-lg border border-slate-700 p-4">
                            <p className="text-slate-400 text-sm">Erfolgsquote</p>
                            <p className="text-3xl font-bold text-emerald-400">{stats.successRate}%</p>
                        </div>
                        <div className="bg-slate-800 rounded-lg border border-slate-700 p-4">
                            <p className="text-slate-400 text-sm">Kontakte bereit</p>
                            <p className="text-3xl font-bold text-emerald-400">{stats.contactsReady}</p>
                        </div>
                        <div className="bg-slate-800 rounded-lg border border-slate-700 p-4">
                            <p className="text-slate-400 text-sm">Alle Kontakte</p>
                            <p className="text-3xl font-bold text-emerald-400">{stats.totalContacts}</p>
                        </div>
                    </div>

                    <div className="bg-slate-800 rounded-lg border border-slate-700 p-4">
                        <h2 className="text-white font-semibold mb-4">Anrufe letzte 7 Tage</h2>
                        <div className="flex justify-center gap-2 items-end h-32">
                            {chartData.map(d => (
                                <div key={d.date} className="bar-chart-item">
                                    <div
                                        className="bar-chart-bar"
                                        style={{ height: `${(d.count / maxCount) * 100}px` }}
                                    ></div>
                                    <span className="text-slate-400 text-xs">{d.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-3 gap-4">
                        <button className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-3 rounded font-semibold transition">
                            📞 Anrufsession starten
                        </button>
                        <button className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-3 rounded font-semibold transition">
                            📥 Kontakte importieren
                        </button>
                        <button className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-3 rounded font-semibold transition">
                            ➕ Kontakt hinzufügen
                        </button>
                    </div>

                    {upcomingTasks.length > 0 && (
                        <div className="bg-slate-800 rounded-lg border border-slate-700 p-4">
                            <h2 className="text-white font-semibold mb-3">Kommende Aufgaben (7 Tage)</h2>

                            placeholder="Suchen..."
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            className="flex-1 bg-slate-700 text-white border border-slate-600 rounded px-3 py-2 text-sm"
                        />
                    </div>

                    <div className="flex gap-2 overflow-x-auto pb-2">
                        {[
                            { id: 'all', label: 'Alle' },
                            { id: 'new', label: 'Neu' },
                            { id: 'ready', label: 'Bereit' },
                            { id: 'in_progress', label: 'In Bearbeitung' },
                            { id: 'completed', label: 'Abgeschlossen' },
                            { id: 'archived', label: 'Archiviert' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setStatusFilter(tab.id)}
                                className={`px-4 py-2 rounded text-sm whitespace-nowrap transition ${
                                    statusFilter === tab.id
                                        ? 'bg-emerald-500 text-white'
                                        : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    {loading ? (
                        <div className="text-center py-8">
                            <div className="spin inline-block w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full"></div>
                        </div>
                    ) : (
                        <div className="bg-slate-800 rounded-lg border border-slate-700 overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead>
                                    <tr className="border-b border-slate-700">
                                        <th className="px-4 py-3 text-left text-slate-300 font-semibold">Unternehmen</th>
                                        <th className="px-4 py-3 text-left text-slate-300 font-semibold">Kontakt</th>
                                        <th className="px-4 py-3 text-left text-slate-300 font-semibold">Telefon</th>
                                        <th className="px-4 py-3 text-left text-slate-300 font-semibold">Status</th>
                                        <th className="px-4 py-3 text-left text-slate-300 font-semibold">Letzter Anruf</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredContacts.map(contact => (
                                        <tr
                                            key={contact.id}
                                            onClick={() => {
                                                setSelectedContact(contact);
                                                setShowDetailModal(true);
                                            }}
                                            className="border-b border-slate-700 hover:bg-slate-700 cursor-pointer transition"
                                        >
                                            <td className="px-4 py-3 text-white">{contact.company_name}</td>
                                            <td className="px-4 py-3 text-slate-300">{contact.contact_name}</td>
                                            <td className="px-4 py-3 text-slate-300">{contact.phone || '-'}</td>
                                            <td className="px-4 py-3"><StatusBadge status={contact.status} /></td>
                                            <td className="px-4 py-3 text-slate-400">-</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    <CSVImportModal
                        isOpen={showImportModal}
                        onClose={() => setShowImportModal(false)}
                        onImport={handleImport}
                        contacts={contacts}
                    />

                    {selectedContact && (
                        <ContactDetailModal
                            isOpen={showDetailModal}
                            onClose={() => setShowDetailModal(false)}
                            contactId={selectedContact.id}
                            onCallOutcome={loadContacts}
                        />
                    )}
                </div>
            );
        }

        // Call Mode
        function CallMode({ contacts, onCallComplete }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [showOutcome, setShowOutcome] = useState(false);

            const currentContact = contacts.length > 0 ? contacts[currentIndex] : null;

            const handleCallSaved = () => {
                setShowOutcome(false);
                if (currentIndex < contacts.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    onCallComplete();
                }
            };

            return (
                <div className="space-y-4">
                    <div className="bg-slate-800 border border-slate-700 rounded p-4">
                        <div className="flex justify-between items-center mb-2">
                            <span className="text-slate-400 text-sm">Fortschritt</span>
                            <span className="text-white font-semibold">{currentIndex + 1}/{contacts.length}</span>
                        </div>
                        <div className="w-full bg-slate-700 rounded h-2">
                            <div
                                className="bg-emerald-500 h-2 rounded transition-all"
                                style={{ width: `${contacts.length > 0 ? ((currentIndex + 1) / contacts.length) * 100 : 0}%` }}
                            ></div>
                        </div>
                    </div>

                    {currentContact ? (
                        <div className="bg-slate-800 border border-slate-700 rounded-lg p-8 text-center space-y-6">
                            <div>
                                <h2 className="text-slate-400 text-sm mb-1">Unternehmen</h2>
                                <h1 className="text-4xl font-bold text-white">{currentContact.company_name}</h1>
                            </div>

                            <div>
                                <h3 className="text-2xl font-semibold text-white mb-1">{currentContact.contact_name}</h3>
                                <p className="text-slate-400">{currentContact.job_title}</p>
                            </div>

                            {currentContact.phone && (
                                <a
                                    href={`tel:${currentContact.phone}`}
                                    className="inline-block bg-emerald-500 hover:bg-emerald-600 text-white px-8 py-3 rounded-lg text-xl font-bold transition"
                                >
                                    📞 {currentContact.phone}
                                </a>
                            )}

                            {currentContact.email && (
                                <div>
                                    <a
                                        href={`mailto:${currentContact.email}`}
                                        className="text-emerald-400 hover:text-emerald-300 text-sm"
                                    >
                                        {currentContact.email}
                                    </a>
                                </div>
                            )}

                            {currentContact.linkedin_url && (
                                <div>
                                    <a
                                        href={currentContact.linkedin_url}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="text-emerald-400 hover:text-emerald-300 text-sm"
                                    >
                                        LinkedIn
                                    </a>
                                </div>
                            )}

                            <div className="flex gap-3 justify-center pt-4">
                                <button
                                    onClick={() => setCurrentIndex(Math.max(0, currentIndex - 1))}
                                    disabled={currentIndex === 0}
                                    className="bg-slate-700 hover:bg-slate-600 disabled:bg-slate-800 text-white px-4 py-2 rounded transition disabled:cursor-not-allowed"
                                >
                                    ← Vorheriger
                                </button>
                                <button
                                    onClick={() => setShowOutcome(true)}
                                    className="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded transition"
                                >
                                    ✓ Anrufergebnis erfassen
                                </button>
                                <button
                                    onClick={() => setCurrentIndex(Math.min(contacts.length - 1, currentIndex + 1))}
                                    disabled={currentIndex === contacts.length - 1}
                                    className="bg-slate-700 hover:bg-slate-600 disabled:bg-slate-800 text-white px-4 py-2 rounded transition disabled:cursor-not-allowed"
                                >
                                    Nächster →
                                </button>
                            </div>
                        </div>
                    ) : (
                        <div className="text-center py-8">
                            <p className="text-slate-400">Keine Kontakte zum Anrufen</p>
                        </div>
                    )}

                    {currentContact && (
                        <CallOutcomeModal
                            isOpen={showOutcome}
                            onClose={() => setShowOutcome(false)}
                            contact={currentContact}
                            onSave={handleCallSaved}
                        />
                    )}
                </div>
            );
        }

        // Tasks View
        function TasksView() {
            const [tasks, setTasks] = useState([]);
            const [statusFilter, setStatusFilter] = useState('all');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const loadTasks = async () => {
                    try {
                        setLoading(true);
                        let query = supabase
                            .from('tasks')
                            .select('*, contacts(contact_name, company_name)');

                        if (statusFilter !== 'all') {
                            query = query.eq('status', statusFilter);
                        }

                        const { data, error } = await query.order('due_date', { ascending: true });
                        if (error) throw error;

                        setTasks(data || []);
                    } catch (error) {
                        console.error('Error loading tasks:', error);
                    } finally {
                        setLoading(false);
                    }
                };

                loadTasks();
            }, [statusFilter]);

            const taskTypeEmojis = {
                'send_showreel': '📹',
                'send_offer': '📧',
                'send_case_study': '📊',
                'prepare_presentation': '🎯',
                'follow_up_call': '📞',
                'follow_up_email': '✉️',
                'other': '📋'
            };

            const taskTypeLabels = {
                'send_showreel': 'Showreel senden',
                'send_offer': 'Angebot senden',
                'send_case_study': 'Case Study senden',
                'prepare_presentation': 'Präsentation vorbereiten',
                'follow_up_call': 'Follow-up Anruf',
                'follow_up_email': 'Follow-up E-Mail',
                'other': 'Sonstige'
            };

            return (
                <div className="space-y-4">
                    <h1 className="text-3xl font-bold text-white">Aufgaben</h1>

                    <div className="flex gap-2 overflow-x-auto pb-2">
                        {[
                            { id: 'all', label: 'Alle' },
                            { id: 'open', label: 'Offen' },
                            { id: 'in_progress', label: 'In Bearbeitung' },
                            { id: 'done', label: 'Erledigt' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setStatusFilter(tab.id)}
                                className={`px-4 py-2 rounded text-sm whitespace-nowrap transition ${
                                    statusFilter === tab.id
                                        ? 'bg-emerald-500 text-white'
                                        : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                                }`}
                            >
                                {tab.label}
                            </button>
                        ))}
                    </div>

                    {loading ? (
                        <div className="text-center py-8">
                            <div className="spin inline-block w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full"></div>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {tasks.length > 0 ? (
                                tasks.map(task => (
                                    <div key={task.id} className="bg-slate-800 border border-slate-700 rounded-lg p-4">
                                        <div className="flex items-start justify-between gap-3">
                                            <div className="flex-1">
                                                <div className="flex items-center gap-2 mb-2">
                                                    <span className="text-2xl">{taskTypeEmojis[task.task_type]}</span>
                                                    <h3 className="text-white font-semibold">{taskTypeLabels[task.task_type]}</h3>
                                                </div>
                                                <p className="text-slate-300 text-sm mb-2">{task.contacts?.company_name} - {task.contacts?.contact_name}</p>
                                                {task.description && <p className="text-slate-400 text-sm">{task.description}</p>}
                                                <p className="text-slate-500 text-xs mt-2">Fällig: {new Date(task.due_date).toLocaleDateString('de-DE')}</p>
                                            </div>
                                            <div className="flex gap-2">
                                                {task.task_type === 'follow_up_call' && (
                                                    <button className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded text-sm transition">
                                                        Anrufen
                                                    </button>
                                                )}
                                                <button className="bg-slate-700 hover:bg-slate-600 text-white px-3 py-1 rounded text-sm transition">
                                                    Erledigt
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            ) : (
                                <div className="text-center py-8">
                                    <p className="text-slate-400">Keine Aufgaben</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // Sidebar Navigation
        function Sidebar({ activeView, onViewChange, contactCount, callsToday }) {
            return (
                <div className="w-64 bg-slate-900 border-r border-slate-700 p-4 flex flex-col h-screen">
                    <div className="mb-8">
                        <h1 className="text-2xl font-bold text-emerald-400">SpreadCaller</h1>
                        <p className="text-slate-400 text-xs">Cold Calling CRM</p>
                    </div>

                    <nav className="space-y-2 flex-1">
                        {[
                            { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                            { id: 'contacts', label: 'Kontakte', icon: '👥' },
                            { id: 'callmode', label: 'Anrufen', icon: '📞' },
                            { id: 'tasks', label: 'Aufgaben', icon: '✓' }
                        ].map(item => (
                            <button
                                key={item.id}
                                onClick={() => onViewChange(item.id)}
                                className={`w-full flex items-center gap-2 px-3 py-2 rounded transition ${
                                    activeView === item.id
                                        ? 'bg-emerald-500 text-white'
                                        : 'text-slate-300 hover:bg-slate-800'
                                }`}
                            >
                                <span>{item.icon}</span>
                                <span>{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    <div className="border-t border-slate-700 pt-4 space-y-2 text-sm">
                        <div className="px-3 py-2">
                            <p className="text-slate-400 text-xs">Kontakte: <span className="text-emerald-400 font-semibold">{contactCount}</span></p>
                        </div>
                        <div className="px-3 py-2">
                            <p className="text-slate-400 text-xs">Anrufe heute: <span className="text-emerald-400 font-semibold">{callsToday}</span></p>
                        </div>
                    </div>
                </div>
            );
        }

        // Main App
        function App() {
            const [activeView, setActiveView] = useState('dashboard');
            const [contacts, setContacts] = useState([]);
            const [calls, setCalls] = useState([]);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);

            const loadData = useCallback(async () => {
                try {
                    const { data: contactsData, error: contactsError } = await supabase
                        .from('contacts')
                        .select('*');

                    if (contactsError) throw contactsError;
                    setContacts(contactsData || []);

                    const { data: callsData, error: callsError } = await supabase
                        .from('calls')
                        .select('*');

                    if (callsError) throw callsError;
                    setCalls(callsData || []);
                } catch (error) {
                    console.error('Error loading data:', error);
                    setToast({ message: 'Fehler beim Laden der Daten', type: 'error' });
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                loadData();
            }, [loadData]);

            const callsToday = calls.filter(c => c.call_date.startsWith(new Date().toISOString().split('T')[0])).length;

            return (
                <div className="flex h-screen bg-slate-900">
                    <Sidebar
                        activeView={activeView}
                        onViewChange={setActiveView}
                        contactCount={contacts.length}
                        callsToday={callsToday}
                    />

                    <div className="flex-1 overflow-auto">
                        <div className="p-8">
                            {loading ? (
                                <div className="text-center py-8">
                                    <div className="spin inline-block w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full"></div>
                                </div>
                            ) : activeView === 'dashboard' ? (
                                <Dashboard contacts={contacts} calls={calls} />
                            ) : activeView === 'contacts' ? (
                                <ContactsList onContactSelected={() => {}} onRefresh={loadData} />
                            ) : activeView === 'callmode' ? (
                                <CallMode contacts={contacts.filter(c => c.status === 'ready')} onCallComplete={() => setActiveView('dashboard')} />
                            ) : activeView === 'tasks' ? (
                                <TasksView />
                            ) : null}
                        </div>
                    </div>

                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        }

        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
